{{- /* バンドル生成は js-bundle.html に委譲し、partialCached で一度だけ実行する。 */ -}}
{{- $js := partialCached "js-bundle.html" "main" "main" -}}
<script src="{{ $js.RelPermalink }}"{{ with $js.Data.Integrity }} integrity="{{ . }}" crossorigin="anonymous"{{ end }}></script>
{{- /* 検索ページだけクライアント検索スクリプトを足す。 */ -}}
{{- if eq .Layout "search" }}
{{- $search := partialCached "js-bundle.html" "search" "search" -}}
<script src="{{ $search.RelPermalink }}"{{ with $search.Data.Integrity }} integrity="{{ . }}" crossorigin="anonymous"{{ end }}></script>
{{- end }}
